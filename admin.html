<!DOCTYPE html>
<html>
<head>
<title>Admin LIVE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial; padding:15px; background:#f1f5f9}
.card{background:white; padding:15px; border-radius:14px; margin:8px; display:inline-block; min-width:140px; text-align:center}
.big{font-size:28px; font-weight:bold}
</style>
</head>
<body>
<h1>📊 Admin LIVE Dashboard</h1>
<input id="menuInput" placeholder="Today's Menu" style="width:60%; padding:10px">
<button onclick="saveMenu()" style="background:#2563eb; color:white; padding:10px">Save Menu</button>
<p>Current Menu: <b id="currMenu"></b></p>

<div class="card">EAT<div class="big" id="yes">0</div></div>
<div class="card">SKIP<div class="big" id="no">0</div></div>
<div class="card">Saved<div class="big" id="saved">0 Kg</div></div>
<div class="card">Money<div class="big" id="money">₹0</div></div>

<h3 id="cookQty" style="background:white; padding:12px; border-radius:10px"></h3>
<table border="1" cellpadding="8" id="table" style="background:white; border-collapse:collapse"></table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  // PASTE SAME CONFIG HERE
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "123456",
  appId: "1:123456:web:abc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let today = new Date().toISOString().split('T')[0];

window.saveMenu = ()=>{ 
  let m=document.getElementById('menuInput').value;
  set(ref(db, `menu/${today}`), m);
}

onValue(ref(db, `menu/${today}`), snap=>{ document.getElementById('currMenu').innerText = snap.val()||"Default"; });

onValue(ref(db, `votes/${today}`), snap=>{
  let data=snap.val()||{};
  let yes=0,no=0, table='<tr><th>Roll</th><th>Status</th></tr>';
  for(let r in data){ if(data[r]=='YES') yes++; else no++; table+=`<tr><td>${r}</td><td>${data[r]}</td></tr>`; }
  document.getElementById('yes').innerText=yes;
  document.getElementById('no').innerText=no;
  document.getElementById('saved').innerText=(no*0.15).toFixed(1)+' Kg';
  document.getElementById('money').innerText='₹'+(no*30);
  document.getElementById('cookQty').innerText=`Cook: Rice ${(yes*0.15+1).toFixed(1)}Kg | Sambar ${(yes*0.1).toFixed(1)}L | Curd ${(yes*0.05).toFixed(1)}L`;
  document.getElementById('table').innerHTML=table;
});
</script>
</body>
</html>
