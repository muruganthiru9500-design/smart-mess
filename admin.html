<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Smart Mess</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f7fb;padding:16px}.card{max-width:600px;margin:0 auto;background:#fff;border-radius:16px;padding:20px}h1{text-align:center;color:#1a73e8}table{width:100%;margin-top:16px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee}th{background:#f5f7fb}.winner{background:#e6f4ea;font-weight:700}button{padding:10px 16px;border:none;border-radius:8px;margin:4px}.primary{background:#1a73e8;color:#fff}.danger{background:#ea4335;color:#fff}</style>
</head>
<body>
<div class="card">
<h1>📊 Admin Dashboard</h1>
<p id="total" style="text-align:center;color:#666;margin:8px 0">Loading...</p>
<table><thead><tr><th>Item</th><th>Votes</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table>
<div style="text-align:center;margin-top:16px">
<button class="primary" onclick="location.reload()">Refresh</button>
<button class="danger" onclick="resetVotes()">Reset All (New Day)</button>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDr5KIf9nbjtdRuLf_lUGi1y-p0ZlKe0YM",authDomain:"smart-mess-df9e6.firebaseapp.com",projectId:"smart-mess-df9e6",storageBucket:"smart-mess-df9e6.firebasestorage.app",messagingSenderId:"839521192409",appId:"1:839521192409:web:1e7c21aaef6d98c81531c8",measurementId:"G-H8V58S0RNB"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function load(){db.collection("votes_today").onSnapshot(snap=>{let counts={};let voters=new Set();snap.forEach(d=>{let data=d.data();counts[data.item]=(counts[data.item]||0)+1;voters.add(data.voterId);});document.getElementById("total").textContent=`Total Voters: ${voters.size}`;let sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);let max=sorted[0]?sorted[0][1]:0;let tbody=document.getElementById("tbody");tbody.innerHTML="";sorted.forEach(([item,c])=>{let tr=document.createElement("tr");if(c==max&&max>0)tr.className="winner";tr.innerHTML=`<td>${item}</td><td>${c}</td><td>${c==max&&max>0?"🏆 WINNER":""}</td>`;tbody.appendChild(tr);});if(sorted.length==0)tbody.innerHTML="<tr><td colspan=3 style='text-align:center;color:#999'>No votes yet</td></tr>";});}
function resetVotes(){if(!confirm("Delete all votes for new day?"))return;db.collection("votes_today").get().then(s=>{let b=db.batch();s.forEach(d=>b.delete(d.ref));return b.commit();}).then(()=>alert("Reset done!"));}
load();
</script>
</body>
</html>
