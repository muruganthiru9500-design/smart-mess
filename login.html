<script>
function login() {
  let roll = document.getElementById("rollno").value.trim();
  let error = document.getElementById("error");
  if(roll === ""){
    error.innerText = "Roll Number is required!";
    error.style.display = "block";
    return;
  }
  localStorage.setItem("studentRoll", roll);
  alert("Welcome " + roll + " - Login Success!");
  // For testing, we stay on same page first
  window.location.href = "./"; 
}
</script>
