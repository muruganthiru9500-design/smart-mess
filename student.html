<!DOCTYPE html>
<html>
<head>
<title>SmartMess Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; text-align:center; padding:15px; background:#f8fafc}
.card{background:white; padding:20px; border-radius:16px; box-shadow:0 4px 12px #0001; margin:auto; max-width:400px}
button{padding:14px 28px; margin:8px; border:none; border-radius:12px; font-weight:bold; cursor:pointer}
.yes{background:#22c55e; color:white} .no{background:#ef4444; color:white}
input{padding:12px; width:85%; border-radius:10px; border:1px solid #ddd}
</style>
</head>
<body>
<h1>🍛 SmartMess LIVE</h1>
<div class="card">
<h3 id="date"></h3>
<h2 id="menuDisplay">Loading...</h2>
<input id="roll" placeholder="Roll No e.g. 21CS001"><br><br>
<button class="yes" onclick="vote('YES')">✅ WILL EAT</button>
<button class="no" onclick="vote('NO')">❌ WILL SKIP</button>
<h3 id="msg"></h3>
<p>Live: Eating <span id="liveYes">0</span> | Skip <span id="liveNo">0</span></p>
</div>
<p><a href="admin.html">Admin →</a></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  // PASTE YOUR CONFIG HERE
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "123456",
  appId: "1:123456:web:abc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let today = new Date().toISOString().split('T')[0];
document.getElementById('date').innerText = today;

// Load Menu
onValue(ref(db, `menu/${today}`), (snap)=>{
  document.getElementById('menuDisplay').innerText = snap.val() || "Rice, Sambar, Curd, Fry";
});

// Live Count
onValue(ref(db, `votes/${today}`), (snap)=>{
  let data = snap.val() || {};
  let yes = Object.values(data).filter(v=>v=='YES').length;
  let no = Object.values(data).filter(v=>v=='NO').length;
  document.getElementById('liveYes').innerText = yes;
  document.getElementById('liveNo').innerText = no;
});

window.vote = function(choice){
  let roll = document.getElementById('roll').value.trim().toUpperCase();
  if(!roll){ alert('Enter Roll No'); return; }
  set(ref(db, `votes/${today}/${roll}`), choice);
  document.getElementById('msg').innerText = roll + " voted " + choice + " ✓";
}
</script>
</body>
</html>
